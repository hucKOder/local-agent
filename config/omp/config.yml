# oh-my-pi (omp) configuration
# Install: ./install.sh (copies to ~/.omp/agent/config.yml)
# Auth: omp login xai-oauth (Grok subscription), then omp login opencode-go.
#
# Grok is flat rate, opencode-go is a metered allowance.
# Grok handles the main and hard turns. Cheap opencode-go models handle
# fan-out, and they are the only overflow targets when Grok is rate limited.

enabledProviders:
  - xai-oauth
  - opencode-go

# Skip the `claude` discovery source (another harness's CLAUDE.md, commands
# and MCP config): it would add to every prompt. Project rules go in AGENTS.md.
disabledProviders:
  - claude

modelRoles:
  # main agent
  default: xai-oauth/grok-4.7:high
  # hard reasoning, ultrathink, /review reviewers
  slow: xai-oauth/grok-4.7:xhigh
  # plan mode
  plan: xai-oauth/grok-4.7:high
  # `task` subagent workers
  task: opencode-go/gpt-5.6-luna:high
  # `scout` and `sonic` subagents, quick lookups
  smol: opencode-go/mimo-v2.6-flash
  # image input
  vision: xai-oauth/grok-4.7:low
  # omp commit, harness chores
  commit: opencode-go/glm-5.3-flash
  # per-turn reviewer. Off until advisor.enabled is true: it reviews every turn on Grok.
  advisor: xai-oauth/grok-4.7:medium

advisor:
  enabled: false

defaultThinkingLevel: high
textVerbosity: low

# Never let a rate limit silently promote a model. Fallbacks are cheap
# opencode-go models only, and the primary returns after the cooldown.
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - opencode-go/gpt-5.6-luna
      - opencode-go/minimax-m3
    slow:
      - opencode-go/gpt-5.6-luna
      - opencode-go/minimax-m3
    plan:
      - opencode-go/gpt-5.6-luna
      - opencode-go/minimax-m3
    advisor:
      - opencode-go/gpt-5.6-luna
      - opencode-go/minimax-m3
    task:
      - opencode-go/mimo-v2.6-flash
      - opencode-go/deepseek-v4-flash
    smol:
      - opencode-go/deepseek-v4-flash
      - opencode-go/glm-5.3-flash
    vision:
      - opencode-go/mimo-v2-omni
    commit:
      - opencode-go/mimo-v2.6-flash

# Parallel requests per provider. omp has no per-model limit.
providers:
  maxInFlightRequests:
    xai-oauth: 2
    opencode-go: 4

# Default is 32 concurrent subagents. Cap fan-out so a big parallel run
# cannot drain the metered opencode-go allowance.
task:
  maxConcurrency: 4

compaction:
  enabled: true
  keepRecentTokens: 40000

# Oversized tool output spills to an artifact file and is previewed.
# Nothing is lost; the agent can re-read the file on demand.
tools:
  artifactSpillThreshold: 20
  artifactTailLines: 500
