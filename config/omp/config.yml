# oh-my-pi (omp) configuration
# Install: ./install.sh (copies to ~/.omp/agent/config.yml)
# Auth: omp login openai-codex, then omp login xai-oauth.
#
# Two flat-rate subscriptions with separate pools.
# openai-codex runs the interactive work: GPT-6 Astra for the main agent and
# plans, cheap GPT-5.6 Luna for workers, lookups and chores. Astra is capped
# at roughly 5-45 messages per 5 hours, so it is kept off fan-out roles.
# xai-oauth runs the fan-out-heavy background roles (/review reviewers,
# ultrathink, advisor) and is the fallback when the openai-codex window runs out.

enabledProviders:
  - openai-codex
  - xai-oauth

# Skip the `claude` discovery source (another harness's CLAUDE.md, commands
# and MCP config): it would add to every prompt. Project rules go in AGENTS.md.
disabledProviders:
  - claude

modelRoles:
  # main agent
  default: openai-codex/gpt-6-astra:medium
  # hard reasoning, ultrathink, /review reviewers (several at once, so not on Astra)
  slow: xai-oauth/grok-4.7:xhigh
  # plan mode
  plan: openai-codex/gpt-6-astra:medium
  # `task` subagent workers
  task: openai-codex/gpt-5.6-luna:high
  # `scout` and `sonic` subagents, quick lookups
  smol: openai-codex/gpt-5.6-luna:low
  # image input
  vision: openai-codex/gpt-5.6-terra:low
  # omp commit, harness chores
  commit: openai-codex/gpt-5.6-luna:low
  # per-turn reviewer. Off until advisor.enabled is true: it reviews every turn.
  advisor: xai-oauth/grok-4.7:medium

advisor:
  enabled: false

defaultThinkingLevel: high
textVerbosity: low

# Each subscription is the other's fallback, and the primary returns after
# the cooldown. The openai-codex allowance is shared across its models, so an
# openai-codex role falls back to Grok rather than to another openai-codex model.
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - xai-oauth/grok-4.7:high
    plan:
      - xai-oauth/grok-4.7:high
    slow:
      - openai-codex/gpt-6-astra:max
    advisor:
      - openai-codex/gpt-5.6-luna:high
    task:
      - xai-oauth/grok-4.7:high
    smol:
      - xai-oauth/grok-4.7:low
    vision:
      - xai-oauth/grok-4.7:low
    commit:
      - xai-oauth/grok-4.7:low

# Parallel requests per provider. omp has no per-model limit.
# openai-codex has no published concurrency limit; lower it on 429s.
providers:
  maxInFlightRequests:
    openai-codex: 4
    xai-oauth: 2

# Default is 32 concurrent subagents. Cap fan-out so a big parallel run
# cannot drain the openai-codex 5-hour window.
task:
  maxConcurrency: 4

compaction:
  enabled: true
  keepRecentTokens: 40000

# Oversized tool output spills to an artifact file and is previewed.
# Nothing is lost; the agent can re-read the file on demand.
tools:
  artifactSpillThreshold: 20
  artifactTailLines: 500
